name: CI

# Runs on every PR to dev or main.
on:
  pull_request:
    branches: [dev, main]

env:
  # Threshold of changed lines (insertions + deletions) above which the
  # "local-review" job triggers even if the PR doesn't touch sensitive
  # folders. Adjust this number based on the project.
  DIFF_LINE_THRESHOLD: 80
  # List of sensitive folders/paths. Edit that file, not this workflow,
  # to add or remove paths.
  SENSITIVE_PATHS_FILE: .github/sensitive-paths.txt

jobs:
  # ---------------------------------------------------------------------
  # Job that ALWAYS runs: lint, unit tests, and the calculation of
  # whether the local AI review needs to be triggered.
  # ---------------------------------------------------------------------
  checks:
    name: Lint, tests, and diff analysis
    runs-on: ubuntu-latest
    outputs:
      trigger_review: ${{ steps.diff-check.outputs.trigger_review }}
      diff_lines: ${{ steps.diff-check.outputs.diff_lines }}
      sensitive_hit: ${{ steps.diff-check.outputs.sensitive_hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth 0 because we need to diff against the PR's base.
          fetch-depth: 0

      # ---------------------------------------------------------------
      # LINT — generic placeholder. The real stack hasn't been decided
      # yet for this project (it's a template). Replace this step with
      # the corresponding linter once it's decided, for example:
      #
      #   Python:   pip install ruff && ruff check .
      #   Node/TS:  npm ci && npm run lint
      #   Go:       go vet ./... && staticcheck ./...
      #   Rust:     cargo clippy --all-targets --all-features -- -D warnings
      # ---------------------------------------------------------------
      - name: Lint (placeholder — replace with the real linter)
        run: |
          echo "TODO(ci): no linter configured yet."
          echo "Replace this step with the linter for the chosen stack (see comments in ci.yml)."

      # ---------------------------------------------------------------
      # TESTS — generic placeholder. Replace once the stack is
      # decided, for example:
      #
      #   Python:   pip install -r requirements.txt && pytest
      #   Node/TS:  npm ci && npm test
      #   Go:       go test ./...
      #   Rust:     cargo test
      # ---------------------------------------------------------------
      - name: Unit tests (placeholder — replace with real tests)
        run: |
          echo "TODO(ci): no unit tests configured yet."
          echo "Replace this step with the test runner for the chosen stack (see comments in ci.yml)."

      - name: Calculate diff size and sensitive folders
        id: diff-check
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          # Sum of inserted + deleted lines across the whole PR diff.
          DIFF_LINES=$(git diff --numstat "$BASE_SHA" "$HEAD_SHA" \
            | awk '{add+=$1; del+=$2} END {print add+del+0}')
          echo "Changed lines in the diff: $DIFF_LINES (threshold: $DIFF_LINE_THRESHOLD)"

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Modified files:"
          echo "$CHANGED_FILES"

          SENSITIVE_HIT=false
          if [ -f "$SENSITIVE_PATHS_FILE" ]; then
            while IFS= read -r raw_path || [ -n "$raw_path" ]; do
              # Ignore comments and empty lines.
              path="${raw_path%%#*}"
              path="$(echo "$path" | xargs)"
              [ -z "$path" ] && continue

              while IFS= read -r file; do
                [ -z "$file" ] && continue
                case "$file" in
                  "$path"*)
                    echo "Sensitive path detected: $file (rule: $path)"
                    SENSITIVE_HIT=true
                    ;;
                esac
              done <<< "$CHANGED_FILES"
            done < "$SENSITIVE_PATHS_FILE"
          fi

          TRIGGER=false
          if [ "$DIFF_LINES" -gt "$DIFF_LINE_THRESHOLD" ] || [ "$SENSITIVE_HIT" = true ]; then
            TRIGGER=true
          fi

          {
            echo "diff_lines=$DIFF_LINES"
            echo "sensitive_hit=$SENSITIVE_HIT"
            echo "trigger_review=$TRIGGER"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Diff summary"
            echo "- Changed lines: $DIFF_LINES (threshold: $DIFF_LINE_THRESHOLD)"
            echo "- Touches sensitive folder?: $SENSITIVE_HIT"
            echo "- Triggers \`local-review\`?: $TRIGGER"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # Conditional job: only runs if the diff exceeds the threshold or
  # touches a sensitive folder. Designed for a self-hosted runner on a
  # machine with Ollama running on localhost:11434 (no paid API used).
  #
  # Register the runner (see README.md / CLAUDE.md) with the
  # "self-hosted" label so this job can run there.
  # ---------------------------------------------------------------------
  local-review:
    name: Local review (Ollama)
    needs: checks
    if: needs.checks.outputs.trigger_review == 'true'
    runs-on: [self-hosted]
    # Minimum permissions scoped to this job: it needs to comment on the
    # PR (gh pr comment) but shouldn't inherit more than read access to
    # contents. Don't touch the repo's default permissions (read-only) or
    # add this block at the workflow level — that would leave every job
    # with more permissions than it needs.
    permissions:
      contents: read
      pull-requests: write
    env:
      OLLAMA_HOST: http://localhost:11434
      # Model to use. To change it: pull it with `ollama pull <model>`
      # on the runner machine and update this value.
      OLLAMA_MODEL: phi4-mini
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get the PR diff
        run: |
          set -euo pipefail
          git diff "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > /tmp/pr.diff
          # Trim the size so we don't overflow the local model's context
          # (this isn't a cost limit, it's the model's context limit).
          head -c 60000 /tmp/pr.diff > /tmp/pr.diff.trimmed
          echo "Diff truncated to $(wc -c < /tmp/pr.diff.trimmed) bytes (from $(wc -c < /tmp/pr.diff) originally)."

      - name: Check Ollama availability
        id: check-ollama
        run: |
          set +e
          HTTP_CODE=$(curl -s -m 5 --connect-timeout 5 -o /dev/null -w "%{http_code}" "$OLLAMA_HOST/api/tags")
          CURL_EXIT=$?
          set -e
          if [ "$CURL_EXIT" -ne 0 ] || [ "$HTTP_CODE" != "200" ]; then
            echo "unavailable=true" >> "$GITHUB_OUTPUT"
          else
            echo "unavailable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Local review unavailable
        if: steps.check-ollama.outputs.unavailable == 'true'
        run: |
          echo "::error::Local review unavailable: couldn't connect to Ollama at $OLLAMA_HOST (timeout or connection refused). Review manually."
          exit 1

      - name: Send diff to Ollama
        id: ollama-review
        if: steps.check-ollama.outputs.unavailable == 'false'
        run: |
          set -euo pipefail

          PROMPT_FILE=$(mktemp)
          {
            echo "You are scanning a pull request diff for a fixed checklist of known risk"
            echo "patterns. This is NOT an open-ended code review: do not reason about"
            echo "business logic, correctness, or whether the code does what it's supposed"
            echo "to do. Only pattern-match against the 7 items below."
            echo ""
            echo "Checklist:"
            echo "1. Hardcoded secrets, API keys, tokens, or passwords in code or config"
            echo "2. SQL queries built via string concatenation/formatting instead of"
            echo "   parameterized queries"
            echo "3. Bare except: clauses or empty exception handlers that silently"
            echo "   swallow errors"
            echo "4. User input passed directly to eval(), exec(), os.system(), or shell"
            echo "   commands without sanitization"
            echo "5. Missing input validation on function parameters that are later used"
            echo "   in file paths, DB queries, or system calls"
            echo "6. Debug code left in (print statements, console.log, commented-out"
            echo "   blocks, TODO/FIXME/XXX markers)"
            echo "7. Obvious resource leaks (files/connections opened without being"
            echo "   closed or without a context manager)"
            echo ""
            echo "Output format: exactly one line per checklist item, numbered 1-7, each"
            echo "either \"N. Not found\" or \"N. Found: <exact line or snippet>\". Cite the"
            echo "snippet itself only — no explanation, no suggestions, no docstring/style/"
            echo "test commentary, no other text of any kind."
            echo ""
            echo "If all seven items are \"Not found\", do not print the checklist at all —"
            echo "output only this single line: \"No matches found in this diff.\""
            echo ""
            echo "Diff:"
            cat /tmp/pr.diff.trimmed
          } > "$PROMPT_FILE"

          jq -Rs --arg model "$OLLAMA_MODEL" '{model: $model, prompt: ., stream: false, options: {num_predict: 900, temperature: 0.2}}' \
            "$PROMPT_FILE" > /tmp/payload.json

          if ! curl -sS -m 300 -X POST "$OLLAMA_HOST/api/generate" \
              -H "Content-Type: application/json" \
              -d @/tmp/payload.json \
              -o /tmp/ollama_response.json; then
            echo "::error::Local review unavailable: failed to call the Ollama API at $OLLAMA_HOST. Review manually."
            exit 1
          fi

          jq -r '.response // empty' /tmp/ollama_response.json > /tmp/review.txt

          if [ ! -s /tmp/review.txt ]; then
            echo "::error::Local review unavailable: Ollama responded with no content. Review manually."
            exit 1
          fi

      - name: Post PR comment
        if: steps.ollama-review.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "## Local review (Ollama · $OLLAMA_MODEL)"
            echo ""
            cat /tmp/review.txt
            echo ""
            echo "---"
            echo "_Automatically generated by the \`local-review\` job on a self-hosted runner,"
            echo "without using any paid API. For manual review of cases this reviewer doesn't"
            echo "cover well (complex business logic), use \`/solopreneur:review\`._"
          } > /tmp/comment-body.md

          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file /tmp/comment-body.md \
            --repo "${{ github.repository }}"
